<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RADAR Demo</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--ink2:#4a4a46;--muted:#7a7a74;--line:#e4e2dc;--grid:#efede7;--accent:#2a78d6;--accent-soft:#eaf2fc;--warn:#eb6834;--warn-soft:#fdeee6;--ok:#2f8f5b;--ok-soft:#e8f4ed;--amber:#c98a12;--amber-soft:#fbf3df;
--t-unlikely:#dbe7f7;--t-possible:#9dc1ee;--t-probable:#4f8fe0;--t-definite:#1f5fb8;
--a1:#2a78d6;--a1s:#eaf2fc;--a2:#13897d;--a2s:#e3f4f1;--a3:#7a55d0;--a3s:#efeafb;--a4:#c46a12;--a4s:#fbefe2;
--d-icu:#c8372d;--d-icus:#fbe6e4;--d-ward:#c46a12;--d-wards:#fbefe2;--d-obs:#2a78d6;--d-obss:#eaf2fc;--d-dis:#2f8f5b;--d-diss:#e8f4ed;--d-ed:#6b6a64;--d-eds:#efede7;--red:#c8372d;--red-soft:#fbe6e4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--ink:#f0efec;--ink2:#c9c8c2;--muted:#94938d;--line:#34332f;--grid:#2a2926;--accent:#3987e5;--accent-soft:#1c2a3d;--warn:#d95926;--warn-soft:#3a2418;--ok:#4fb07c;--ok-soft:#18301f;--amber:#d9a43a;--amber-soft:#332914;
--t-unlikely:#2a3a50;--t-possible:#2f5689;--t-probable:#3d78c6;--t-definite:#6aa6f0;
--a1:#5b9ff0;--a1s:#1c2a3d;--a2:#3cbfae;--a2s:#14302c;--a3:#a88af0;--a3s:#2a2240;--a4:#e8994a;--a4s:#3a2a18;
--d-icu:#ef6b60;--d-icus:#3d1e1b;--d-ward:#e8994a;--d-wards:#3a2a18;--d-obs:#5b9ff0;--d-obss:#1c2a3d;--d-dis:#4fb07c;--d-diss:#18301f;--d-ed:#b4b3ad;--d-eds:#2a2926;--red:#ef6b60;--red-soft:#3d1e1b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
html[lang="en"] [lang="zh"],html[lang="zh"] [lang="en"]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em}.brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.sp{flex:1}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.steps{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;min-width:64px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.step[disabled]{opacity:.4;cursor:default}
.step.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.done:not(.on){border-color:var(--accent);color:var(--accent)}
.banner{font-size:12px;color:var(--muted);margin:10px 0 0}
.banner b{color:var(--warn)}
h2{font-size:20px;margin:18px 0 4px;letter-spacing:-.01em}
.lede{color:var(--ink2);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 8px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;line-height:1.3}
.seg button b{display:block;font-size:14px}
.seg button small{color:var(--muted)}
.seg button.on{border:2px solid var(--accent);background:var(--accent-soft);padding:9px 7px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fld .in{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);font-weight:600;min-height:40px;display:flex;align-items:center;gap:6px}
.fld .in small{font-weight:400;color:var(--muted)}
.lock{font-size:12px;color:var(--muted);margin-top:10px}
@media (min-width:640px){.form{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cta{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:700;padding:14px;cursor:pointer;margin:6px 0 4px}
.cta:active{transform:scale(.99)}
.cta.ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:18px 4px}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* agent cards */
.cards{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none;margin:0 -2px}
.cards::-webkit-scrollbar{display:none}
.ac{flex:0 0 100%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column}
@media (min-width:900px){.cards{overflow:visible;display:grid;align-items:start;grid-template-columns:repeat(3,minmax(0,1fr))}.ac{flex:none}.pager{display:none!important}}
.ac-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ac-id{font-weight:800;color:var(--accent);font-size:13px;background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.ac-n{font-size:13px;font-weight:700;color:var(--ink2)}
.ac-k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ac-big{font-size:24px;font-weight:800;line-height:1.2;margin:2px 0 8px;letter-spacing:-.01em}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700}
.t-unlikely{background:var(--t-unlikely)}.t-possible{background:var(--t-possible)}.t-probable{background:var(--t-probable);color:#fff}.t-definite{background:var(--t-definite);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t-definite{color:#0b1626}}
.ac p{margin:0 0 8px;color:var(--ink2);font-size:14px}
.ac>p{background:var(--ags,var(--grid));border-radius:10px;padding:9px 12px;margin:0 0 10px;color:var(--ink)}
.ac>p.plainp{background:none;padding:0;margin:2px 0 8px}
.ac .rs{background:var(--ags,var(--grid));border-radius:8px;padding:6px 10px;margin:4px 0 2px;color:var(--ink2);font-size:13px}
.ac ul{margin:4px 0 8px;padding-left:18px;font-size:14px;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more-n{font-size:12.5px;color:var(--muted);margin:-4px 0 6px}
.ac{border-top:4px solid var(--ag,var(--accent))}
.ac.ag1{--ag:var(--a1);--ags:var(--a1s)}.ac.ag2{--ag:var(--a2);--ags:var(--a2s)}.ac.ag3{--ag:var(--a3);--ags:var(--a3s)}.ac.ag4{--ag:var(--a4);--ags:var(--a4s)}
.ac .ac-id{color:var(--ag);background:var(--ags)}.ac .ac-n{color:var(--ag)}
.ac .ac-k{color:var(--ag);opacity:.85}
.disp{display:inline-block;border-radius:12px;padding:4px 12px;margin:2px 0 10px;background:var(--dbg);color:var(--dfg)}
.disp.icu{--dbg:var(--d-icus);--dfg:var(--d-icu)}.disp.ward{--dbg:var(--d-wards);--dfg:var(--d-ward)}.disp.observation{--dbg:var(--d-obss);--dfg:var(--d-obs)}.disp.discharge{--dbg:var(--d-diss);--dfg:var(--d-dis)}.disp.continue_workup{--dbg:var(--d-eds);--dfg:var(--d-ed)}.disp.abstain{--dbg:var(--red-soft);--dfg:var(--red)}
.urg{display:inline-block;border-radius:12px;padding:4px 12px;margin:2px 0 10px}
.urg.u1{background:var(--red-soft);color:var(--red)}.urg.u3{background:var(--amber-soft);color:var(--amber)}.urg.u0{background:var(--grid);color:var(--ink2)}
.yes{color:var(--a1)}.dec-give{color:var(--a3)}.dec-hold{color:var(--muted)}
.fg-why .fchip{background:var(--a1s);color:var(--a1)}.fg-watch .fchip{background:var(--amber-soft);color:var(--amber)}.fg-wait .fchip{background:var(--grid);color:var(--ink2)}
.lab.hi{background:var(--red-soft)}.lab.hi .v{color:var(--red)}.lab.lo{background:var(--a1s)}.lab.lo .v{color:var(--a1)}
.lab .flag{font-size:11px;font-weight:700;margin-left:3px}
.seg button i.pd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.step.on{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
.brand{background:linear-gradient(90deg,var(--a1),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{-webkit-text-fill-color:var(--muted)}
.msw{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}.msw:empty{display:none}
.msw button{border:0;background:none;padding:5px 10px;font:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer}.msw button.on{background:var(--a3s);color:var(--a3);font-weight:700}
@media (max-width:520px){.msw button{padding:5px 7px;font-size:11.5px}.brand small{display:none}}
.msw button,.btn-s{white-space:nowrap}
.tr-note{font-size:11.5px;color:var(--muted)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.fchip{background:var(--grid);border-radius:8px;padding:3px 9px;font-size:13px}.ac li{margin:3px 0}
.rows{border-top:1px solid var(--grid);margin-top:4px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:14px}
.row span:first-child{color:var(--ink2)}.row b{text-align:right}
.tag{display:inline-block;font-size:11.5px;border-radius:5px;padding:1px 6px;font-weight:700;margin-left:4px;vertical-align:1px}
.tag.now{background:var(--warn-soft);color:var(--warn)}.tag.soon{background:var(--amber-soft);color:var(--amber)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.cites{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:14px;padding:2px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.ac .warnbox{background:var(--warn-soft);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:14px;margin-bottom:8px}
.more{margin-top:auto;padding-top:10px}
.more>button{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink2);border-radius:10px;padding:8px;font:inherit;font-size:13px;cursor:pointer}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 6px}
.pager button{border:1px solid var(--line);background:var(--card);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--ink)}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;max-height:82vh;overflow:auto;padding:8px 16px 28px;transform:translateY(100%);transition:transform .22s ease,visibility .22s;visibility:hidden;max-width:760px;margin:0 auto}
.sheet.open{transform:none;visibility:visible}.sheet-bg.open{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
.q{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.q mark{background:#fff1a8;color:#1d1d1b;border-radius:2px;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .q mark{background:#6b5a12;color:#fff}}
.q ul{padding-left:18px;margin:6px 0 0;color:var(--ink2);font-size:13px}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.node{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.node-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.node-h b:first-child{color:var(--accent)}.node-h .ans{margin-left:auto;background:var(--grid);border-radius:6px;padding:0 7px;font-weight:700;font-size:13px}
.ev{border-left:3px solid var(--accent);padding:4px 10px;margin:6px 0;font-size:13.5px}
.ev.opp{border-left-color:var(--warn)}
.ev .im{color:var(--ink2)}
.vb{display:inline-block;font-size:11.5px;border-radius:5px;padding:1px 6px;margin:4px 4px 0 0;border:1px solid var(--line)}
.vb.ok{color:var(--ok);border-color:var(--ok)}.vb.bad{color:var(--warn);border-color:var(--warn)}
.h5{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 0 2px}
/* checkpoint */
.sl{margin:4px 0 18px}
.sl-h{display:flex;justify-content:space-between;align-items:baseline}
.sl-h b{font-size:15px}.sl-v{font-size:22px;font-weight:800}.sl-v small{font-size:13px;font-weight:500;color:var(--muted)}
.zone{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:3px}
.track{position:relative;height:44px;margin-top:4px}
.track .bands{position:absolute;left:0;right:0;top:18px;height:8px;border-radius:4px;overflow:hidden;display:flex}
.track .bands i{height:100%;opacity:.45}
.track input{position:absolute;left:0;right:0;top:8px;width:100%;margin:0;height:28px;background:transparent;-webkit-appearance:none;appearance:none}
.track input::-webkit-slider-runnable-track{height:28px;background:transparent}
.track input::-moz-range-track{height:28px;background:transparent}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2);margin-top:1px}
.track input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--card);border:3px solid var(--ink)}
.ticks{position:relative;height:18px;font-size:11.5px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span.stop{color:var(--ink);font-weight:700}
.ticks span.stop::before{content:"";position:absolute;left:50%;top:-12px;width:2px;height:8px;background:var(--ink);margin-left:-1px}
.labs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:640px){.labs{grid-template-columns:repeat(6,minmax(0,1fr))}}
.lab{background:var(--bg);border-radius:10px;padding:7px 9px}
.lab .k{font-size:11.5px;color:var(--muted)}.lab .v{font-weight:700}.lab .v small{font-weight:400;color:var(--muted);font-size:11px}
.foot{font-size:12px;color:var(--muted);margin-top:24px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="bar"><div class="brand">RADAR<small></small></div><span class="sp"></span><div class="msw" id="msw"></div><button class="btn-s" id="lang">中文 / EN</button></div>
 <div class="steps" id="steps"></div></div>
 <div id="view"></div>
 <div class="foot" id="foot"></div>
</div>
<div class="sheet-bg" id="sbg"></div><div class="sheet" id="sheet"><div class="grab"></div><button class="x" id="sx">×</button><div id="sbody"></div></div>
<div class="toast" id="toast"></div>
<script>
const D=/*__DATA__*/null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Z=(zh,en)=>`<span lang="zh">${zh}</span><span lang="en">${en}</span>`;
const nice=s=>esc(String(s??'—').replace(/_/g,' '));
const CPS=[['C0_5','0.5 h',Z('0.5 小时','0.5 h')],['C1','1 h',Z('1 小时','1 h')],['C3','3 h',Z('3 小时','3 h')],['C6','6 h',Z('6 小时','6 h')]];
const TIER={unlikely_sepsis:['unlikely','不太可能','Unlikely'],possible_sepsis:['possible','可能','Possible'],probable_sepsis:['probable','很可能','Probable'],definite_sepsis:['definite','确定','Definite']};
const DISP={observation:['留观','Observation'],ward:['收住院（病房）','Admit to ward'],discharge:['可以出院','Discharge'],icu:['收 ICU','Admit to ICU'],continue_workup:['留急诊继续检查','Stay in ED for workup'],abstain:['请求医生判断','Clinician review needed']};
const DEC={within_1h:['1 小时内给','Within 1 h'],within_3h:['3 小时内给','Within 3 h'],defer_and_monitor:['暂缓，继续观察','Defer and monitor'],give:['给','Give'],withhold:['暂不给','Withhold'],start:['开始','Start'],hold:['暂不用','Hold'],not_applicable:['不适用','Not applicable'],map_65:['MAP ≥ 65','MAP ≥ 65']};
const ITEM={blood_cultures:['血培养','Blood cultures'],serum_lactate:['血乳酸','Serum lactate'],source_imaging_or_sampling:['感染源影像 / 取样','Source imaging / sampling'],alternative_diagnosis_testing:['替代诊断检查','Alternative-diagnosis testing']};
const PRIO={immediate:['立即','Now','now'],this_visit:['本次就诊','This visit','soon']};
const LABN={wbc:['白细胞','WBC'],hemoglobin:['血红蛋白','Hgb'],platelets:['血小板','Platelets'],creatinine:['肌酐','Creatinine'],bun:['尿素氮','BUN'],bilirubin_total:['总胆红素','Bilirubin'],glucose:['血糖','Glucose'],sodium:['钠','Na'],potassium:['钾','K'],bicarbonate:['碳酸氢根','HCO₃'],anion_gap:['阴离子间隙','Anion gap']};
const tr=(m,k)=>m[k]?Z(m[k][0],m[k][1]):nice(k);
const S={mi:0,pid:'P1',view:'T0',t0done:false,shown:{},lac:'L2',map:'M1',seen:new Set()};
let TOK=0;

function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(TOK);TOK=setTimeout(()=>t.classList.remove('on'),1800)}
function sheet(h){$('#sbody').innerHTML=h;$('#sheet').classList.add('open');$('#sbg').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open');$('#sbg').classList.remove('open')}

function steps(){
 const b=[['T0','T0',Z('分诊','Triage')]].concat(CPS);
 $('#steps').innerHTML=b.map(([id,,lab])=>`<button class="step ${S.view===id?'on':''} ${S.seen.has(id)?'done':''}" data-step="${id}" ${id!=='T0'&&!S.t0done?'disabled':''}>${id==='T0'?'T0 · ':''}${lab}</button>`).join('');
}


/* ---------- plain language for clinicians ---------- */
const FIELD=[['agent2.workup_recommendation','待做检查','pending workup'],['workup_state','待回报结果','pending results'],
['agent1.shock_concern','休克风险','shock concern'],['agent1_context.shock_concern','休克风险','shock concern'],['agent1.tier','脓毒症可能性','sepsis likelihood'],['agent1_context.tier','脓毒症可能性','sepsis likelihood'],
['patient_state.sofa','器官功能（SOFA）','organ function (SOFA)'],['patient_state.vitals_trend','生命体征趋势','vital-sign trend'],
['patient_state.vitals.map','血压','blood pressure'],['patient_state.vitals.sbp','血压','blood pressure'],['patient_state.vitals.heart_rate','心率','heart rate'],

 if(!lab)lab=[null,null];const key=lab[1]||'other';if(!seen.has(key))seen.set(key,lab)});

 <div class="track"><div class="bands">${bands.map(([a,b,c])=>`<i style="width:${pct(b)-pct(a)}%;background:${c}"></i>`).join('')}</div>
 <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-sl="${key}" aria-label="${unit}"></div>
 <div class="ticks">${[min,max].map(x=>`<span style="left:${pct(x)}%">${x}</span>`).join('')}${Object.entries(levels).map(([k,x])=>`<span class="stop" style="left:${pct(x)}%">${x}</span>`).join('')}</div></div>`;
}
const REF={wbc:[4,11],hemoglobin:[12,17.5],platelets:[150,400],creatinine:[0.6,1.2],bun:[7,20],bilirubin_total:[0.1,1.2],glucose:[70,140],sodium:[135,145],potassium:[3.5,5.1],bicarbonate:[22,29],anion_gap:[3,12]};
function viewCP(){
 const cp=CPS.find(c=>c[0]===S.view),p=D.patients[S.pid],L=D.levels,u=L.lab_units,v=p.t0.triage_vitals;
 const okc='var(--ok)',am='var(--amber)',wr='var(--red)';
 return `<h2>${cp[2]} · ${Z(p.label.zh,p.label.en)}</h2><p class="lede">${Z('这是截至这个时间点已经出来的结果。拖动滑块选乳酸和 MAP（会吸附到最近的预设值），然后查看 Agent 建议。','Results available by this time. Drag the sliders for lactate and MAP (they snap to the nearest preset), then view the agents’ advice.')}</p>
 <div class="card">
 ${slider('lac',Z('血乳酸','Serum lactate'),'mmol/L',0.5,8,0.1,L.lactate,S.lac,[[0.5,2,okc],[2,4,am],[4,8,wr]],zoneLac)}
 ${slider('map',Z('平均动脉压 MAP','Mean arterial pressure'),'mmHg',40,110,1,L.map,S.map,[[40,65,wr],[65,70,am],[70,110,okc]],zoneMap)}
 <div class="ac-k" style="margin-bottom:6px">${Z('其他结果（这位病人固定）','Other results (fixed for this patient)')} <span class="tr-note" style="text-transform:none;letter-spacing:0">${Z('↑↓ 按常用成人参考范围标注，仅供演示','↑↓ flagged against common adult reference ranges; demo only')}</span></div>
 <div class="labs">${Object.entries(p.labs).map(([k,x])=>{const rg=REF[k];const f=rg?(x>rg[1]?'hi':x<rg[0]?'lo':''):'';return `<div class="lab ${f}"><div class="k">${tr(LABN,k)}</div><div class="v">${x} <small>${esc(u[k]||'')}</small>${f?`<span class="flag">${f==='hi'?'↑':'↓'}</span>`:''}</div></div>`}).join('')}
 <div class="lab"><div class="k">${Z('心率','HR')}</div><div class="v">${v.heart_rate}</div></div><div class="lab"><div class="k">${Z('呼吸','RR')}</div><div class="v">${v.resp_rate}</div></div>
 <div class="lab"><div class="k">${Z('吸氧','Oxygen')}</div><div class="v">${p.oxygen?Z('鼻导管','Nasal cannula'):Z('未吸氧','Room air')}</div></div>
 <div class="lab"><div class="k">${Z('已给治疗','Given so far')}</div><div class="v">${Z('无','None')}</div></div>
 <div class="lab"><div class="k">${Z('血培养','Blood cultures')}</div><div class="v">${Z('待回报','Pending')}</div></div></div>
 </div>
 <button class="cta" id="gocp">${Z('查看 Agent 建议','View agent advice')}</button><div id="outcp"></div>`;
}
function showCP(){
 const k=`${S.pid}|${S.view}|${S.lac}|${S.map}`,r=M().cp[k],cp=CPS.find(c=>c[0]===S.view);QS=[];AGS=[];
 if(!r){$('#outcp').innerHTML=`<div class="card">${Z('这个组合还没有运行结果。','No result for this combination yet.')}</div>`;return}
 if(r.err){$('#outcp').innerHTML=`<div class="card">${Z('这个组合运行时停止了：','This run stopped: ')}${esc(r.err)}</div>`;return}
 $('#outcp').innerHTML=`<h2>${Z('Agent 建议','Agent advice')} · ${cp[2]}</h2><p class="lede">${Z('A1 重新评估、A3 治疗、A4 去向。','A1 reassessment, A3 treatment, A4 disposition.')}</p>`
  +cardsWrap([cardA1(r.a1,cp[1]),cardA3(r.a3,r.rec,cp[1]),cardA4(r.a4,cp[1])])
  +`<div class="seg" style="grid-template-columns:repeat(4,1fr);margin-top:10px">${CPS.filter(c=>c[0]!==S.view).map(([id,,l])=>`<button data-step="${id}" style="text-align:center"><b>${l}</b></button>`).join('')}<button data-step="T0" style="text-align:center"><b>T0</b></button></div>`;
 bindCards();
}
function loading(el,cb){el.innerHTML=`<div class="loading"><div class="spin"></div>${Z('Agent 正在分析…','Agents are working…')}</div>`;setTimeout(()=>{cb();el.scrollIntoView({behavior:'smooth',block:'start'})},650)}
function render(){
 steps();
 $('#view').innerHTML=(S.view==='T0'?viewT0():viewCP());
 if(S.view==='T0'&&S.t0done&&S.shown.T0===S.pid)showT0();
 if(S.view!=='T0'&&S.shown[S.view]===`${S.pid}|${S.lac}|${S.map}`)showCP();
}
const M=()=>D.models[S.mi];
function msw(){if(D.models.length<2){$('#msw').innerHTML='';return}$('#msw').innerHTML=D.models.map((m,i)=>`<button class="${i===S.mi?'on':''}" data-mi="${i}" title="${esc(m.meta.model)}">${esc(m.label)}</button>`).join('')}
function foot(){
 const m=M().meta;
 $('#foot').innerHTML=`<div style="margin-bottom:6px"><b>${Z('仅供演示，不用于临床决策。','For demonstration only; not for clinical decisions.')}</b> ${Z('三位病人和全部数值都是小兔叽（Yana 的 AI 助手）编写的示例，不是真实病例。','All three patients and every value are examples written by Bunny (Yana’s AI assistant), not real patients.')}</div>
 ${m.dry_run?`<div style="color:var(--warn)"><b>DRY RUN</b> · ${Z('当前是空跑数据，Agent 输出是工程占位，不是模型结果。','dry-run data; agent outputs are engineering stubs, not model results.')}</div>`:''}
 ${Z('运行','Run')} ${esc(m.run_id)} · ${Z('模型','model')} ${esc(m.model)} · code ${esc(m.code_commit)}`;
}
document.querySelector('.brand small').innerHTML=Z('脓毒症辅助决策演示','sepsis decision-support demo');
try{const L=localStorage.getItem('radar-demo-lang');if(L)document.documentElement.lang=L}catch(e){}
$('#lang').onclick=()=>{const n=document.documentElement.lang==='en'?'zh':'en';document.documentElement.lang=n;try{localStorage.setItem('radar-demo-lang',n)}catch(e){}};
document.addEventListener('click',e=>{
 const t=e.target;let b;
 if(b=t.closest('[data-mi]')){S.mi=+b.dataset.mi;msw();render();foot();toast(Z('已切换到 ','Switched to ')+esc(M().label));return}
 if(b=t.closest('[data-pid]')){S.pid=b.dataset.pid;S.shown={};render();return}
 if(b=t.closest('[data-step]')){if(b.disabled)return;S.view=b.dataset.step;render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(t.closest('#go0')){S.t0done=true;S.shown.T0=S.pid;S.seen.add('T0');steps();loading($('#out0'),showT0);return}
 if(t.closest('#gocp')){S.shown[S.view]=`${S.pid}|${S.lac}|${S.map}`;S.seen.add(S.view);steps();loading($('#outcp'),showCP);return}
 if(b=t.closest('[data-q]')){const[i,q]=QS[+b.dataset.q];openStmt(i,q);return}
 if(b=t.closest('[data-ag]')){const[a,ti]=AGS[+b.dataset.ag];detailsSheet(a,ti);return}
 if(b=t.closest('[data-pg]')){const c=$('#cards');c.scrollBy({left:c.clientWidth*+b.dataset.pg,behavior:'smooth'});return}
 if(t.closest('[data-lock]'))toast(Z('演示版数值为预设，可以切换病人','Demo values are preset; switch patients instead'));
 if(t.closest('#sx')||t===$('#sbg'))closeSheet();
});
document.addEventListener('input',e=>{const s=e.target.closest('[data-sl]');if(!s)return;
 const key=s.dataset.sl,lv=key==='lac'?D.levels.lactate:D.levels.map,x=+s.value;
 const best=Object.entries(lv).sort((a,b)=>Math.abs(a[1]-x)-Math.abs(b[1]-x))[0][0];
 const box=s.closest('.sl'),val=lv[best],z=(key==='lac'?zoneLac:zoneMap)(val);
 box.querySelector('.sl-v').innerHTML=`${val} <small>${key==='lac'?'mmol/L':'mmHg'}</small><span class="zone tag ${z[1]}">${z[0]}</span>`;
 s.dataset.pending=best;});
document.addEventListener('change',e=>{const s=e.target.closest('[data-sl]');if(!s)return;const key=s.dataset.sl,best=s.dataset.pending;if(!best)return;
 if(key==='lac')S.lac=best;else S.map=best;s.value=(key==='lac'?D.levels.lactate:D.levels.map)[best];
 if(S.shown[S.view]&&S.shown[S.view]!==`${S.pid}|${S.lac}|${S.map}`){$('#outcp').innerHTML=`<div class="lock" style="margin:4px 2px">${Z('数值改了，点上面按钮重新查看。','Values changed; tap the button to view again.')}</div>`}});
msw();render();foot();
</script>
</body>
</html>
