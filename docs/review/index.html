 if((m=/^nice_ng253_(.+)$/.exec(id))){const n=m[1].replace(/_/g,"."),p=GLP.nice[n];return {txt:`${NICE_REF}, recommendation ${n} (section ${n.split(".").slice(0,2).join(".")})${p?`, PDF page ${p}`:""}`,find:`NICE NG253 ${n}`,url:"https://www.nice.org.uk/guidance/ng253"}}
 if((m=/^table_0*(\d+)$/.exec(id)))return {txt:`${SSC_REF}, Table ${m[1]}${m[1]==="3"?" (Sepsis Terminology in This Guideline), page 736":""}`,find:`Surviving Sepsis Campaign 2026 Table ${m[1]}`};
 if((m=/^SSC\s*(.+)$/i.exec(id))){const ns=m[1].match(/\d+/g)||[];return {txt:`${SSC_REF}, recommendation${ns.length>1?"s":""} ${ns.map(n=>n+(GLP.ssc[n]?` (page ${GLP.ssc[n]})`:"")).join(" and ")}`,find:`Surviving Sepsis Campaign 2026 recommendation ${ns.join(" ")}`}}
 if((m=/^([a-z0-9_]+)::(.+)$/i.exec(id))){const G={sepsis3:"Sepsis-3 consensus definitions (Singer M, et al. JAMA 2016;315:801-810)",pe2026:"2026 AHA/ACC guideline on acute pulmonary embolism",acs2025:"2025 ACC/AHA guideline on acute coronary syndromes",hf2022:"2022 AHA/ACC/HFSA heart failure guideline",kdigo2012_aki:"KDIGO 2012 acute kidney injury guideline",ats_cap2019:"ATS/IDSA 2019 community-acquired pneumonia guideline",sofa2_2025:"SOFA-2 score (2025)",sccm_steroids2024:"SCCM 2024 guideline on corticosteroids in sepsis, ARDS and pneumonia"}[m[1]]||m[1].replace(/_/g," ");
  const it=/^[\d_]+$/.test(m[2])?"recommendation "+m[2].replace(/_/g,"."):m[2].replace(/_/g," ").replace(/\bqsofa\b/i,"qSOFA").replace(/\bsofa\b/i,"SOFA");return {txt:`${G}, ${it}`,find:`${G.replace(/\s*\(.*\)$/,"")} ${it}`}}
 return {txt:id.replace(/_/g," "),find:id.replace(/_/g," ")}}
/* internal codes in RADAR's text -> plain words */
const HUM=[[/decided by code rule/g,"decided by a fixed rule"],[/\bacs_or_mi\b/g,"acute coronary syndrome or myocardial infarction"],[/\bother_noninfectious\b/g,"another non-infectious cause"],[/\bICU7_vasopressor_recommended\b/g,"a vasopressor is recommended"],[/\bsofa_ge_2(_established)?\b/gi,"SOFA score of 2 or more"],[/\bconfirmed_repeat_map\b/g,"confirmed by a repeat MAP"],[/\bvasopressor_active\b/gi,"vasopressor running"],[/\bpending_resolvable\b/g,"waiting for results that can settle it"],[/\bnone_documented\b/g,"none documented"],
 [/\s*\((?:R[1-4][ab]?|W\d+|TX\d+|D[1-4])\)/g,""],[/\bAgent 1\b/g,"RADAR's assessment step"],[/\bAgent 2\b/g,"RADAR's test step"],[/\bAgent 3\b/g,"RADAR's treatment step"],[/\bAgent 4\b/g,"RADAR's level-of-care step"],
 [/\bR1\b/g,"evidence of infection"],[/\bR2\b/g,"organ dysfunction"],[/\bR3[ab]?\b/g,"alternative diagnosis"],[/\bR4\b/g,"shock or hypoperfusion"],[/\bW\d+(?:\s*(?:,|and)\s*W\d+)*\b/g,"test rules"],
 [/\bC0_5\b/g,"0.5 h"],[/\bC([136])\b/g,"$1 h"],[/\b([A-Za-z][A-Za-z0-9]*(?:_[A-Za-z0-9]+)+)\b/g,m=>m.replace(/_/g," ")]];
const hum=h=>String(h).split(/(<[^>]+>)/).map(x=>x.startsWith("<")?x:HUM.reduce((t,[re,to])=>t.replace(re,to),x)).join("");
function pullSrc(html,ids){return String(html).replace(/\s*<span class="?src"?>([^<]+)<\/span>/g,(m,x)=>{x.split(/\s*,\s*/).forEach(y=>{if(!ids.includes(y))ids.push(y)});return ""})}
function cardHtml(R){const conf=c=>c?`<span class="conf conf-${c}">confidence: ${c}</span>`:"";
 const item=it=>{const ids=[];const txt=hum(pullSrc(it.txt,ids)),F=(it.forr||[]).map(x=>hum(pullSrc(x,ids))),G=(it.against||[]).map(x=>hum(pullSrc(x,ids))),M=(it.more||[]).map(x=>hum(pullSrc(x,ids)));
  return `<li>${txt} ${conf(it.conf)}${F.length||G.length||M.length?`<div class="ev">${F.length?`<div><b>For:</b> ${F.join("; ")}</div>`:""}${G.length?`<div><b>Against:</b> ${G.join("; ")}</div>`:""}${M.length?`<div class="more"><b>More data needed:</b> ${M.join("; ")}</div>`:""}</div>`:""}${ids.length?`<details class="gl"><summary>Guideline items cited (${ids.length})</summary><ul>${ids.map(x=>{const L=glLoc(x);return `<li>${esc(L.txt)} <button type="button" class="cp" data-copy="${esc(L.find)}">Copy to search</button>${L.url?` <a href="${L.url}" target="_blank" rel="noopener">Open the guideline</a>`:""}</li>`}).join("")}</ul><span class="small muted">The guideline text is not shown here; use the reference above to find it. </span><a href="../kg/" target="_blank" rel="noopener">Open the knowledge graph</a></details>`:""}</li>`};
 const meta=R.sections.filter(s=>/RADAR output/.test(s.h)),main=R.sections.filter(s=>!/RADAR output/.test(s.h));
 return `<div class="panel radar"><h3 style="margin-top:0">RADAR's card for this patient at ${TP[tp]}${R.prerun?" · run in advance":R.live?" · live":""}</h3><div>${R.badges.map(([t,f])=>`<span class="badge ${f?"fill":""}">${esc(hum(t))}</span>`).join("")}</div>
 ${main.map(s=>`<h3>${esc(s.h.replace(/\s*\(Agent \d\)/,""))}</h3><ul class="cardlist">${s.items.map(item).join("")}</ul>`).join("")}
 <details class="gl" style="margin-top:8px"><summary>About this card</summary>${meta.map(s=>`<ul class="cardlist small">${s.items.map(it=>`<li>${hum(it.txt)}</li>`).join("")}</ul>`).join("")}<p class="small muted">${R.live?"This card is RADAR's real output, run live on your own orders up to this time point.":R.prerun?"This card is RADAR's real output, run in advance on this simulated patient along the order path closest to yours.":"This card is built from RADAR's rules written out for the review; confidence levels are illustrative."}</p></details></div>`}
const cardRecord=R=>({prerun:R.prerun||null,live:R.live||null,sections:R.sections.map(s=>({h:s.h,items:s.items.map(it=>({...it,txt:String(it.txt).replace(/<[^>]+>/g,"")}))}))});

/* ---------- the two working tabs ---------- */
function bindCopy(){app.querySelectorAll("button.cp").forEach(b=>b.onclick=async()=>{const t=b.dataset.copy;try{await navigator.clipboard.writeText(t);b.textContent="Copied"}catch(e){b.textContent=t}setTimeout(()=>{b.textContent="Copy to search"},1800)})}
function sideHtml(tab){return `<nav class="side" aria-label="Patients">${S.order.map((id,n)=>{const c=byId(id),lock=tab==="radar"&&!allDone("own",id),cur=S.cur[tab];
  return `<div class="pt ${cur&&cur.id===id?"on":""} ${lock?"lock":""}"><div class="ptn">Patient ${n+1}${lock?` <span class="small muted">· finish on your own first</span>`:""}</div><div class="ptt small">${esc(c.title)}</div><div class="tps">${TP.map((t,i)=>{const a=A(tab,id)[i];return `<button type="button" data-id="${id}" data-i="${i}" class="tpb ${cur&&cur.id===id&&cur.i===i?"on":""} ${a&&a.done?"done":""} ${a&&a.stale?"stale":""}" title="${a&&a.stale?"An earlier time point changed: please look at this one again":a&&a.done?"Done":"Not done"}">${t}</button>`}).join("")}</div></div>`}).join("")}
  <p class="small muted">Filled = done. <span class="stalekey">Dashed</span> = an earlier time point changed; please look again.</p></nav>`}
function renderWork(tab){const c=S.cur[tab];if(!c){tab==="own"?openOwnTab():setTab("home");return}
 const id=c.id;setCase(id);tp=c.i;const a=ensure(tab,id,tp),dec=decs(tab,id,tp),sim=simFor(tab,id,tp);
 const notes=TP.slice(0,tp).map((t,i)=>{const s=src(tab,id,i);return s?[["Tests",s.testsOther],["Treatment",s.txOther],["Other",s.other]].filter(x=>x[1]&&x[1].trim()).map(x=>`${t} · ${x[0]}: ${esc(x[1])}`):[]}).flat();
 let R=null;if(tab==="radar"){R=liveCard(id,tp,dec,sim)||radarCard(tp,sim);a.card=cardRecord(R)}
 const own=tab==="radar"?A("own",id)[tp]:null;
 app.innerHTML=`<div class="shell">${sideHtml(tab)}<div class="work">
  <div class="actions"><span><b>Patient ${pn(id)} of 5</b> · ${tabName[tab]} · ${TP[tp]} <span class="small muted">(time point ${tp+1} of 5)</span>${a.stale?` <span class="req">an earlier time point changed: please look again</span>`:""}</span><span class="toolbar"><button type="button" id="tb-guide">Tutorial and score definitions</button></span></div>
  <div class="grid"><div class="panel">${chartHtml(sim)}${notes.length?`<h3>What you wrote earlier</h3><ul class="small">${notes.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${modelNote()}</div>
  <div style="display:flex;flex-direction:column;gap:16px;min-width:0">${R?cardHtml(R):""}
   ${tab==="radar"?`<div class="callout">After reading RADAR's card: is there anything below you would now change? These are your own answers at ${TP[tp]}. <b>Edit them directly</b>; leave them as they are if nothing changes.</div>`:""}
   <div class="panel"><h2>${tab==="radar"?"Your plan at "+TP[tp]:(tp===0?"What would you order now?":"Your orders have been carried out. Update your plan.")}</h2>${tab==="own"&&tp>0?`<p class="small muted">Your assessment from ${TP[tp-1]} is filled in; change anything that should change. Choose only new tests and the treatments you want now.</p>`:""}
   <div id="form">${formHtml9(a,tab,sim)}</div>
   <div id="notice"></div>
   <div class="actions" style="margin-top:12px"><span>${tp>0?`<button type="button" id="back">Back to ${TP[tp-1]}</button>`:""}</span><span><button type="button" class="primary" id="next">${tp<4?"Save and go to "+TP[tp+1]:"Save this patient"}</button></span></div></div></div></div></div></div>`;
 const form=app.querySelector("#form");const rer=()=>{const y=scrollY;form.innerHTML=formHtml9(a,tab,sim);app.querySelector("#notice").innerHTML="";scrollTo(0,y)};
 bindForm(form,a,rer);bindCopy();
 app.querySelectorAll(".tpb").forEach(b=>b.onclick=()=>go(tab,b.dataset.id,+b.dataset.i));
 app.querySelector("#tb-guide").onclick=()=>{S.last={tab,id,i:tp};S.guide=2;setTab("guide")};
 const bk=app.querySelector("#back");if(bk)bk.onclick=()=>show(tab,id,tp-1);
 if(tab==="radar"&&liveOn()&&!R.live){const key=liveKey(id,tp,dec);const pr=app.querySelector(".panel.radar");if(pr)pr.insertAdjacentHTML("afterbegin",liveNoteHtml(key));const myTp=tp;
  liveEnsure(id,tp,dec,()=>{const cc=S.cur.radar;if(S.tab!=="radar"||!cc||cc.id!==id||cc.i!==myTp)return;const L=liveCard(id,myTp,dec,sim);if(L){swapCard(L);bindCopy();a.card=cardRecord(L);save()}})}
 app.querySelector("#next").onclick=()=>{const N=app.querySelector("#notice"),need=[];
  if(!a.conf)need.push(["sec-conf","how sure you are (1 to 5)"]);if(tab==="radar"&&(a.radarRating===null||a.radarRating===undefined))need.push(["sec-rad","your rating of RADAR's card"]);
  const link=([s,l])=>`<a href="#" data-sec="${s}">${esc(l)}</a>`;const wire=()=>N.querySelectorAll("a[data-sec]").forEach(x=>x.onclick=e=>{e.preventDefault();const el=app.querySelector("#"+x.dataset.sec);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600)}});
  if(need.length){N.innerHTML=`<div class="notice need">Needed before you can go on: ${need.map(link).join(", ")}.</div>`;wire();return}
  const emp=emptyList(a);
  if(emp.length&&!pendingSkip){pendingSkip=true;N.innerHTML=`<div class="notice">Left empty: ${emp.map(link).join(", ")}. You can fill them in, or continue without them. <button type="button" id="skipok">Confirm: skip these and continue</button></div>`;wire();N.querySelector("#skipok").onclick=()=>finish();N.scrollIntoView({behavior:"smooth",block:"center"});return}
  finish()};
 function finish(){leave();const L=A(tab,id),sig=JSON.stringify(legacy(a));
  if(a.done&&a.sig&&a.sig!==sig)for(let j=tp+1;j<5;j++){if(L[j]&&L[j].done)L[j].stale=true}
  if(tab==="own"&&a.done&&a.sig&&a.sig!==sig){const Rr=A("radar",id);Rr.forEach(x=>{if(x&&x.done)x.stale=true})}
  a.sig=sig;a.done=true;a.stale=false;delete a.skipped;a.savedAt=new Date().toISOString();a.left=emptyList(a).map(x=>x[1]);
  if(tab==="radar")a.changed=changedFields(a,own);
  if(tp<4){show(tab,id,tp+1);return}
  const pool=tab==="own"?S.order:S.order.filter(x=>allDone("own",x)),nxt=pool.find(x=>!allDone(tab,x));save();
  if(nxt){modal(`<h2>Patient ${pn(id)} is done ${tabName[tab]}</h2><p>Next: Patient ${pn(nxt)}.${tab==="own"?" This patient is now also open in tab 3 (With RADAR).":""}</p>`,[...(tab==="own"?[{label:"Open this patient with RADAR",fn:()=>{S.cur.radar=null;openRadarTab()}}]:[]),{label:"Go to Patient "+pn(nxt),primary:true,fn:()=>show(tab,nxt,firstOpen(tab,nxt))}]);render();return}
  if(tab==="own"){modal(`<h2>All five patients are done on your own</h2><p>Thank you. The next part is tab 3, the same patients with RADAR's card.</p>`,[{label:"Stay here"},{label:"Open tab 3 · With RADAR",primary:true,fn:openRadarTab}]);render();return}
  const rest=S.order.filter(x=>!allDone("radar",x));
  modal(rest.length?`<h2>Patient ${pn(id)} is done with RADAR</h2><p>${rest.length} patient${rest.length>1?"s are":" is"} not yet finished on your own; they open here once they are.</p>`:`<h2>All five patients are done with RADAR</h2><p>Thank you. Press <b>Finish and submit</b> at the top right to send your results.</p>`,rest.length?[{label:"Go to tab 2 · On your own",primary:true,fn:()=>{const x=rest[0];show("own",x,firstOpen("own",x))}}]:[{label:"Close"},{label:"Finish and submit",primary:true,fn:submitDialog}]);render()}}

function render(){renderTabs();document.body.classList.add("compact");
 if(S.tab==="guide")renderGuide();else if(S.tab==="own"||S.tab==="radar")renderWork(S.tab);else renderHome()}

/* ===================== Saving and sending ===================== */
const SEND_URL="https://script.google.com/macros/s/AKfycbxA62PI2MjBe_kUB02AY-V1ELp77v9Gk9lly_xnEUPJGjvIZMFb_mO-KuNi1kHagHnW/exec";
function payload(){const ev=(tab,id)=>{const x=simFor(tab,id,5);return {events:x.events,results:x.results.map(r=>({name:r.name,at:r.at})),vitals:VT.map(x.vital)}};
 const st=JSON.parse(JSON.stringify({...S,liveCode:undefined,liveCards:undefined}));
 return {tool:"RADAR clinician review",version:"sim-9",sentAt:new Date().toISOString(),liveMode:!!LIVE_URL,...st,
  progress:Object.fromEntries(S.order.map(id=>[id,{own:TP.map((_,i)=>isDone("own",id,i)),radar:TP.map((_,i)=>isDone("radar",id,i))}])),
  course:Object.fromEntries(S.order.filter(id=>isDone("own",id,0)).map(id=>[id,{own:ev("own",id),withRadar:allDone("own",id)&&isDone("radar",id,0)?ev("radar",id):null}]))}}
async function sendResults(){if(!SEND_URL)return false;try{await fetch(SEND_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload())});return true}catch(e){return false}}
async function save(loud){try{localStorage.setItem(KEY,JSON.stringify(S));statusEl.textContent="Saved in this browser "+new Date().toLocaleTimeString()}catch(e){statusEl.textContent="This browser cannot keep answers; please finish in one sitting."}}
function download(){const data=payload();const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});const a=document.createElement("a");
 const nm=(S.reviewer.name||"reviewer").replace(/[^A-Za-z0-9]+/g,"_");a.href=URL.createObjectURL(blob);a.download=`RADAR_review_${nm}_sim9.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function submitDialog(){leave();const cnt=t=>S.order.reduce((s,id)=>s+TP.filter((_,i)=>isDone(t,id,i)).length,0),o=cnt("own"),r=cnt("radar");closeModal();
 const m=document.createElement("div");m.className="modal";m.id="modal";
 m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><h2>Finish and submit</h2><p>Done so far: <b>${o} of 25</b> time points on your own and <b>${r} of 25</b> with RADAR.${o<25||r<25?" You can submit now, or go back and finish first.":""}</p>
  <label style="display:block">Your name<input type="text" id="s-name" value="${esc(S.reviewer.name||"")}" autocomplete="name"></label>
  <label class="other">Any other comment for the RADAR team <span class="small muted">(optional)</span><textarea id="s-cm">${esc(S.comment||"")}</textarea></label>
  <p class="err" id="s-e"></p><div class="actions"><span></span><span><button type="button" id="s-no">Go back</button> <button type="button" class="primary" id="s-yes">Submit my results</button></span></div></div>`;
 document.body.appendChild(m);m.querySelector("#s-name").focus();
 m.querySelector("#s-no").onclick=()=>{S.reviewer.name=m.querySelector("#s-name").value.trim();S.comment=m.querySelector("#s-cm").value;save();closeModal()};
 m.querySelector("#s-yes").onclick=async()=>{const nm=m.querySelector("#s-name").value.trim();if(!nm){m.querySelector("#s-e").textContent="Please enter your name.";return}
  S.reviewer.name=nm;S.comment=m.querySelector("#s-cm").value;S.submitted=true;S.submittedAt=new Date().toISOString();S.sent=await sendResults();if(!S.sent)download();await save();closeModal();
  modal(`<h2>Thank you</h2><p>${S.sent?"Your results have been sent to the RADAR team.":"Your results could not be sent automatically, so a file was downloaded. Please email it to the RADAR team."}</p><p><button type="button" id="dl">Download a copy of my results</button></p>`,[{label:"Close",primary:true}]);const d=document.getElementById("dl");if(d)d.onclick=download;render()}}
const RS=document.getElementById("restart");
function restartUI(){RS.innerHTML=`<button type="button" id="rs-btn">Start over</button>`;RS.querySelector("#rs-btn").onclick=()=>{
 RS.innerHTML=`<span class="small">Clear all your answers and start again?</span> <button type="button" id="rs-no">Cancel</button> <button type="button" class="primary" id="rs-yes">Yes, start over</button>`;
 RS.querySelector("#rs-no").onclick=restartUI;
 RS.querySelector("#rs-yes").onclick=()=>{S=fresh();setCase(S.order[0]);tp=0;try{localStorage.removeItem(KEY)}catch(e){};restartUI();render();scrollTo(0,0);statusEl.textContent="Started a new review."}}}
restartUI();
try{const v=localStorage.getItem(KEY);if(v){const o=JSON.parse(v);if(o.v===9&&o.order&&o.order.length===CASES.length&&o.order.every(byId)){S={...S,...o};statusEl.textContent="Picked up where you left off."}}}catch(e){}
document.getElementById("home").onclick=e=>{e.preventDefault();setTab("home")};
window.addEventListener("beforeunload",()=>{leave();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}});
render();

</script>
